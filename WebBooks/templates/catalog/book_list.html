{% extends 'base_generic.html' %}

{% block content %}
    <h1>List of books in database</h1>
    {%  if book_list %}
    <ul>
        {% for book in book_list %}
            <li>
                <a href="{{book.get_absolute_url}}">{{book.title}}</a>({{book.genre}})
                <a href="{% url 'book_update' book.id %}"> update</a>
                <a href="{% url 'book_delete' book.id %}"> delete</a>
            </li>
        {% endfor %}
    </ul>
    {%  else  %}
        <p>no books in database</p>
    {%  endif %}
{% endblock %}
